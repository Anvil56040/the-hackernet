<!DOCTYPE html>
<html>
<head>
<title>Hacker Search</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/x-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Press+Start+2P&family=Tomorrow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
  <style>
  body {
    background: url("https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fmedia.istockphoto.com%2Fid%2F2207953835%2Fvector%2Fno-signal-screensaver-concept.jpg%3Fs%3D612x612%26w%3D0%26k%3D20%26c%3DIXJDz37IOIcASN3NYTrUVNG-svF9y7V1G_iOJh5dBVI%3D&f=1&nofb=1&ipt=a8de158bb013c3a7f6cdc7e142a5b5cf38b9b10ea2908a91bbba2816b1024b3a&ipo=images");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
  }
  </style>
<body>
<div class="begin">
<input type="text" class="search" placeholder="Search...">
<button class="button-54" style="margin-top: 15px;">⌕</button>
<h3><a href="index.html" style="text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;">Return</a></h3>
</div>
  <script>
    
// Find search elements
const searchInput = document.querySelector(".search");
const searchButton = document.querySelector(".button-54");

// Perform search
function performSearch() {
    const query = searchInput.value.trim();

    if (!query) {
        searchInput.focus();
        return;
    }

    window.location.href =
        "results.html?q=" + encodeURIComponent(query);
}

// Button click
searchButton.addEventListener("click", performSearch);

// Enter key
searchInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        performSearch();
    }
});

// Focus search box when page loads
searchInput.focus();

  </script>
</body>
</html>
