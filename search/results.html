<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <title>Search Results</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/x-icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&amp;family=Press+Start+2P&amp;family=Tomorrow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;display=swap" rel="stylesheet">
</head>
<body>
<input type="text" class="search" id="searchTerm" value="">
<button class="button-54" style="margin-top: 15px;">➡</button>
 <hr style="color: #33ff33; margin-top: 25px;">
<div id="resultCount"></div>
<div id="results"></div>
<script>

const SUPABASE_URL = "https://jwjlqtudpwfmjpmfbtcl.supabase.co";
const SUPABASE_KEY = "sb_publishable_vk17eG3nL12ETmjhlNA4uA_g8bYxfso";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const searchInput = document.getElementById("searchTerm");
const searchButton = document.querySelector(".button-54");
const resultCount = document.getElementById("resultCount");
const resultsContainer = document.getElementById("results");

const params = new URLSearchParams(window.location.search);
const query = params.get("q") || "";

searchInput.value = query;

// Search again when the button is clicked or Enter is pressed
function performSearch() {
    const newQuery = searchInput.value.trim();

    if (!newQuery) {
        resultCount.textContent = "Please enter a search query.";
        return;
    }

    window.location.href =
        "results.html?q=" + encodeURIComponent(newQuery);
}

searchButton.addEventListener("click", performSearch);

searchInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        performSearch();
    }
});

// Display the search results
function displayResults(pages) {
    resultsContainer.replaceChildren();

    if (!pages || pages.length === 0) {
        resultCount.textContent = "No results found.";
        return;
    }

    resultCount.textContent =
        pages.length +
        (pages.length === 1
            ? " result found."
            : " results found.");

    pages.forEach(function(page) {
        const result = document.createElement("div");
        result.className = "result";

        let websiteURL;

        try {
            websiteURL = new URL(page.url);

            if (!["http:", "https:"].includes(websiteURL.protocol)) {
                return;
            }
        } catch {
            return;
        }

        // Website favicon
        const favicon = document.createElement("img");

        favicon.className = "result-favicon";
        favicon.alt = "";
        favicon.width = 24;
        favicon.height = 24;
        favicon.loading = "lazy";
        favicon.referrerPolicy = "no-referrer";

        const fallbackIcon = new URL(
            "/favicon.ico",
            websiteURL
        ).href;

        favicon.src = page.favicon_url || fallbackIcon;

        favicon.onerror = function() {
            if (favicon.src !== fallbackIcon) {
                favicon.src = fallbackIcon;
            } else {
                favicon.style.display = "none";
            }
        };

        result.appendChild(favicon);

        // Website title
        const title = document.createElement("a");

        title.className = "result-title";
        title.textContent = page.title || page.url;
        title.href = websiteURL.href;

        // Opens in the same tab
        result.appendChild(title);

        // Website description
        const description = document.createElement("p");

        description.className = "result-description";
        description.textContent = page.description || "";

        result.appendChild(description);

        resultsContainer.appendChild(result);
    });
}

// Search Supabase
async function searchPages() {
    if (!query.trim()) {
        resultCount.textContent = "Enter something to search for.";
        return;
    }

    resultCount.textContent = "Searching...";
    resultsContainer.replaceChildren();

    try {
        const { data, error } = await db.rpc("search_pages", {
            search_query: query.trim()
        });

        if (error) {
            console.error("Supabase search error:", error);
            resultCount.textContent =
                "Search error: " + error.message;
            return;
        }

        displayResults(data || []);

    } catch (error) {
        console.error("Hacker Search error:", error);
        resultCount.textContent =
            "Something went wrong: " + error.message;
    }
}

searchPages();
</script>
</body>
</html>
